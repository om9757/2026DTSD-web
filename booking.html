<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Event</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo"> EventBooking</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Restaurants</a>
      <a href="booking.html" class="active">Book Event</a>
    </nav>
  </header>

  <main>
    <h1>Book Your Event</h1>
    <form action="confirmation.html" method="get">
      <label for="restaurant">Choose Restaurant:</label>
      <select id="restaurant" name="restaurant" required>
        <option value="Ocean View">Ocean View Restaurant</option>
        <option value="City Lights">City Lights Bistro</option>
      </select>

      <label for="date">Event Date:</label>
      <input type="date" id="date" name="date" required>

      <label for="guests">Number of Guests:</label>
      <input type="number" id="guests" name="guests" min="1" max="200" required>

      <h3>Pre‑order Food</h3>
      <label><input type="checkbox" name="food" value="Vegetarian"> Vegetarian Menu</label>
      <label><input type="checkbox" name="food" value="Buffet"> Buffet Menu</label>
      <label><input type="checkbox" name="food" value="Desserts"> Desserts</label>

      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <button type="submit">Confirm Booking</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Restaurant Event Booking</p>
  </footer>
</body>
</html>
