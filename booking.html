<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Event</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">EventBooking</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Restaurants</a>
      <a href="booking.html" class="active">Book Event</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <h1>Book Your Event</h1>
    <form action="confirmation.html" method="get">

      <!-- Restaurant Selection -->
      <label for="restaurant">Choose Restaurant:</label>
      <select id="restaurant" name="restaurant" required>
        <option value="">-- Select a Restaurant --</option>
        <option value="Ocean View">Ocean View Restaurant</option>
        <option value="City Lights">City Lights Bistro</option>
      </select>

      <!-- Date -->
      <label for="date">Event Date:</label>
      <input type="date" id="date" name="date" required>

      <!-- Guests -->
      <label for="guests">Number of Guests:</label>
      <input type="number" id="guests" name="guests" min="1" max="200" required>

      <!-- Pre-order Food Contact -->
      <h2>Pre‑order Food</h2>
      <p>For food pre‑orders, please contact us directly:</p>
      <p><a href="tel:02041522056">02041522056</a></p>
      <p><a href="mailto:patelo@stu.otc.school.nz">patelo@stu.otc.school.nz</a></p>

      <!-- User Info -->
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <!-- Submit -->
      <button type="submit">Confirm Booking</button>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    &copy; 2026 Restaurant Event Booking
  </footer>

  <!-- Auto-select restaurant based on query string -->
  <script>
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const restaurant = params.get("restaurant");
      if (restaurant) {
        document.getElementById("restaurant").value = restaurant;
      }
    };
  </script>
</body>
</html>
